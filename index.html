<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>U:NUS 2026 年度活動</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Jersey+10&family=DotGothic16&family=Saira+Condensed:wght@600;700&family=Shippori+Mincho+B1:wght@500;700;800&family=Noto+Serif+TC:wght@700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Concept: 銀色格紋底、黑色陀螺面板、電子寵物 LCD。四位成員的藍黃紅綠是唯一的彩色語彙。 */
:root{
  --ink:#0D0E12; --ink-2:#1C1E26; --silver:#D5D8DE; --silver-2:#E7E9ED; --paper:#F5F6F8; --line:#B4B8C1; --muted:#5A5E69;
  --blue:#2447B8; --yellow:#F0BE2B; --red:#D4222E; --green:#12A150;
  --pop:#7A35E8; --pop2:#7A35E8; --pop-bg:linear-gradient(135deg,#EDE4FF,#FFE0EE); --pop-ink:#E0207A; --pop-val:#34406B; --lcd:#B9C6A5; --lcd-ink:#1B2414; --rk-bg:#1B0D02; --rk-ink:#FFC98A; --lcd-glow:0 0 10px rgba(255,140,30,.85);
  --f-display:"Unbounded","Noto Sans TC",system-ui,sans-serif;
  --f-pixel:"Jersey 10","Noto Sans TC",ui-monospace,monospace;
  --f-num:"Saira Condensed","Arial Narrow",sans-serif;
  --f-min:"Shippori Mincho B1","Noto Serif TC","Noto Sans TC",serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0; padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:var(--silver-2);
  background-image:conic-gradient(rgba(255,255,255,.62) 25%,transparent 0 50%,rgba(255,255,255,.62) 0 75%,transparent 0);
  background-size:56px 56px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5; font-synthesis:none;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--blue); outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.screen[hidden]{display:none!important}

/* ---------- buttons ---------- */
.btn-primary{
  appearance:none;border:0;cursor:pointer;height:56px;padding:0 24px;border-radius:14px;
  background:var(--ink);color:var(--paper);font:900 1rem/1 var(--f-body);letter-spacing:.04em;
  box-shadow:0 5px 0 #000,inset 0 2px 0 rgba(255,255,255,.18);transition:transform .1s,box-shadow .1s,background .15s;
}
.btn-primary:hover{background:var(--ink-2)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 2px 0 #000,inset 0 2px 0 rgba(255,255,255,.18)}
.btn-primary:disabled{background:#8A8E99;box-shadow:0 5px 0 #6A6E78;cursor:not-allowed;transform:none}
.btn-ghost{
  appearance:none;cursor:pointer;height:56px;padding:0 20px;border-radius:14px;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);font:700 .95rem/1 var(--f-body);box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;
}
.btn-ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.link{appearance:none;background:none;border:0;padding:6px 0;color:var(--ink);font:700 .95rem var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* ---------- welcome ---------- */
.welcome{position:relative;display:flex;flex-direction:column;align-items:center;overflow:hidden;
  min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-block:40px 48px}
.welcome>.copy{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:auto;margin:0;padding:0;border:0;line-height:1;white-space:nowrap;text-align:center;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.welcome>.copy::after{content:"";position:absolute;inset:-16px -14px}
@media(max-width:380px){.welcome>.copy{letter-spacing:-.01em}}
.corner{position:absolute;width:34px;height:34px;border:0 solid var(--ink)}
.corner.tl{top:12px;left:0;border-top-width:4px;border-left-width:4px}
.corner.tr{top:12px;right:0;border-top-width:4px;border-right-width:4px}
.corner.bl{bottom:12px;left:0;border-bottom-width:4px;border-left-width:4px}
.corner.br{bottom:12px;right:0;border-bottom-width:4px;border-right-width:4px}
.welcome .wrap{flex:1 0 auto;align-content:center;width:100%;max-width:520px;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:18px;text-align:center}
.eyebrow{margin:0;font:400 1.05rem var(--f-pixel);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top{width:clamp(190px,56vw,290px);aspect-ratio:1;border-radius:50%;filter:drop-shadow(0 16px 18px rgba(13,14,18,.35));will-change:transform}
.top-disc{width:100%;height:100%;border-radius:50%;overflow:hidden;border:5px solid var(--ink);background:var(--ink)}
.top-disc img{display:block;width:100%;height:100%;transform:scale(1.07);animation:idle 1s linear infinite}
@keyframes idle{to{transform:scale(1.07) rotate(360deg)}}
h1{margin:0;font:900 clamp(1.9rem,8.2vw,3rem)/1.18 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.lead{margin:0;max-width:30em;color:var(--muted);text-wrap:balance}
#f-name{width:100%;max-width:295px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;text-align:left}
#f-name label{font:400 1.05rem var(--f-pixel);letter-spacing:.12em;text-transform:uppercase}
.field{display:flex;flex-wrap:nowrap;gap:10px}
.field input{flex:0 0 185px;width:185px;min-width:0;height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);
  font:700 .95rem var(--f-body);color:var(--ink);box-shadow:inset 0 2px 0 rgba(13,14,18,.08)}
.field input::placeholder{color:#8A8E99;font-weight:500}
.field{align-items:flex-start}
.field .btn-primary{flex:0 0 100px;width:100px;height:40px;padding:0;border-radius:12px;box-shadow:0 4px 0 #000,inset 0 2px 0 rgba(255,255,255,.18)}
.field .btn-primary:active{transform:translateY(2px);box-shadow:0 2px 0 #000,inset 0 2px 0 rgba(255,255,255,.18)}
.field .btn-primary:disabled{box-shadow:0 4px 0 #6A6E78}
#btn-start{font:700 .8rem/1 var(--f-num);letter-spacing:.06em;white-space:nowrap;padding-top:2px}
.err{margin:0;color:var(--red);font-weight:700;font-size:.9rem}
.copy{width:100%;margin:6px 0 0;padding-top:7px;border-top:1px solid rgba(13,14,18,.1);font:700 12px/1.4 var(--f-min);letter-spacing:.03em;color:rgba(13,14,18,.4);text-align:right}
.cal-copy{margin-top:40px}

/* ---------- calendar ---------- */
.cal{max-width:760px;margin-inline:auto;padding-bottom:88px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:8px 16px 8px;
  background:rgba(231,233,237,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:3px solid var(--ink)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar>div:first-child{min-width:0}
.hi{margin:0;font:400 clamp(1.2rem,5.4vw,1.45rem)/1.1 "Jersey 10","DotGothic16","Noto Sans TC",ui-monospace,monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi.long{font-size:.9rem}
.hi b{font-weight:400;color:var(--ink);text-transform:none;letter-spacing:.04em}
.bar h2{margin:0;font:900 1.2rem/1.25 var(--f-body)}
.lcd{flex:0 0 auto;background:#3A3F4A;color:#EBF0F8;border:1.5px solid #6B7280;border-radius:10px;padding:7px 10px;
  font-family:var(--f-pixel)}
.lcd-k{display:block;font-size:12px;line-height:1.2;letter-spacing:.14em;color:rgba(170,228,255,.75)}
.cells{display:flex;gap:3px}
.cells i{position:relative;display:block;width:11px;height:14px;border-radius:2px;background:rgba(235,240,248,.15)}
.cells b{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:#FFFFFF;box-shadow:0 0 4px rgba(255,255,255,1),0 0 9px rgba(255,255,255,.8),0 0 16px rgba(255,255,255,.45);transition:width .25s ease-out}
@media(prefers-reduced-motion:reduce){.cells b{transition:none}}
/* ---------- 長按存圖面板（內建瀏覽器無法直接下載時使用） ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(13,14,18,.86);display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;gap:14px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet[hidden]{display:none}
.sheet-imgs{min-height:0;width:100%;overflow-y:auto;display:grid;gap:14px;align-content:start;justify-items:center;-webkit-overflow-scrolling:touch}
.sheet img{display:block;max-width:100%;height:auto;border-radius:10px;border:3px solid var(--ink);background:var(--paper);-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.sheet-bar{display:flex;align-items:center;gap:12px;color:var(--paper);font:400 1.05rem/1.3 "DotGothic16","Jersey 10","Noto Sans TC",sans-serif;letter-spacing:.08em}
.sheet-bar .btn-primary{height:40px;padding:0 18px;border-radius:12px;background:var(--paper);color:var(--ink);box-shadow:none;font:400 1rem/1 "DotGothic16","Jersey 10","Noto Sans TC",sans-serif}

.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.lcd-v{font-size:36px;line-height:.95}
.filters{margin:16px 0 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tab{appearance:none;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:3px solid var(--ink);background:var(--paper);
  font:700 .85rem var(--f-body);color:var(--ink);cursor:pointer}
#row-mem{flex-wrap:nowrap}
.tab{flex:0 0 auto;white-space:nowrap}
.tab .abbr{display:none}
#row-mem.short{gap:6px}
#row-mem.short .tab{padding:6px 10px;gap:5px}
#row-mem.short .tab.m .full{display:none}
#row-mem.short .tab.m .abbr{display:inline}
@media(max-width:340px){#row-mem.short{gap:4px}#row-mem.short .tab{padding:5px 8px;gap:4px;border-width:2px;font-size:.8rem}#row-mem.short .tab i{width:10px;height:10px}}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tab i{width:12px;height:12px;border-radius:3px;border:1.5px solid rgba(0,0,0,.45);flex:0 0 auto}
.month{scroll-margin-top:96px}
.mh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 2px 12px}
.mh h3{margin:0;display:flex;align-items:baseline;gap:10px;line-height:1}
.mh h3 .mn{font:400 clamp(4.2rem,18vw,5.6rem)/.8 var(--f-pixel);letter-spacing:.01em}
.mh h3 .ma{font:400 clamp(1.6rem,7vw,2.2rem)/1 var(--f-pixel);letter-spacing:.08em}
.month.mc-brown{--mc:#8A5528}.month.mc-gray{--mc:#66707F}
.mh h3 .mn,.mh h3 .ma{color:var(--mc)}
.mh h3 .mn{text-shadow:3px 3px 0 rgba(13,14,18,.9)}
.mh h3 .ma{text-shadow:2px 2px 0 rgba(13,14,18,.45)}
.mn{font-family:var(--f-pixel)}.ma{font-family:var(--f-pixel)}
.tile .v .mn{font-weight:400;font-size:1em}.tile .v .ma{font-weight:400;font-size:.8em;letter-spacing:.06em;margin-left:.3em}
.mh p{margin:0;font:400 1.05rem var(--f-pixel);letter-spacing:.05em;color:var(--muted);text-align:right}
.mh p .sep{margin:0 .3em}
.mh p b{color:var(--ink);font-size:1.3rem;font-weight:400}
.evs{display:grid;gap:14px}
.ev{display:grid;grid-template-columns:62px minmax(0,1fr) 36px;gap:10px;align-items:center;width:100%;text-align:left;
  padding:12px 14px 12px 10px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;cursor:pointer;
  box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .12s,color .12s;font:inherit}
.ev:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ev[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ev.off,.ev.off:disabled{background:transparent;color:#8A8E99;border:3px dashed var(--line);box-shadow:none;cursor:not-allowed;transform:none}
.ev.off .ev-date,.ev.off .ev-title{opacity:.75}
.ev.off .tick{border:3px dashed var(--line);background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(90,94,105,.18) 5px 10px)}
.ev-date{display:grid;justify-items:center;line-height:1;font-family:var(--f-pixel)}
.ev-date b{font-size:40px;font-weight:400;white-space:nowrap}
.ev-date.range b{font-size:30px;letter-spacing:0}
.ev-date i{font:700 12px/1.2 var(--f-body);font-style:normal;margin-top:6px;opacity:.85;white-space:nowrap;letter-spacing:0}
.ev-date u{font:400 14px var(--f-pixel);text-decoration:none;opacity:.7;margin-top:2px}
.ev-title{display:block;font-family:var(--f-min);font-weight:700;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:7px}
.tag{padding:1px 8px;border-radius:999px;border:2px solid currentColor;font-weight:700;font-size:11.5px;line-height:1.55}
.tag.dash{border-style:dashed}
.sig{display:inline-flex;gap:2px}
.sig i{width:11px;height:11px;border-radius:3px;border:1.5px solid rgba(0,0,0,.4)}
.ev[aria-pressed="true"] .sig i{border-color:rgba(255,255,255,.55)}
.who{font-size:12px;opacity:.72}
.tick{position:relative;width:36px;height:36px;border-radius:11px;border:3px solid var(--ink);background:var(--paper)}
.ev[aria-pressed="true"] .tick{background:var(--paper);border-color:var(--paper)}
.ev[aria-pressed="true"] .tick::after{content:"";position:absolute;left:10px;top:3px;width:9px;height:17px;border:solid var(--ink);border-width:0 4px 4px 0;transform:rotate(42deg)}
.empty{margin:48px 0;text-align:center;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:3px solid var(--ink);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:760px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dock .btn-primary{height:40px;padding:0 18px;border-radius:12px;font:700 1.1rem/1 var(--f-num);letter-spacing:.08em;white-space:nowrap;padding-top:2px;box-shadow:0 3px 0 #000,inset 0 2px 0 rgba(255,255,255,.18)}
.dock .btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #000,inset 0 2px 0 rgba(255,255,255,.18)}
.dock .btn-primary:disabled{box-shadow:0 3px 0 #6A6E78}
.dock-in span{font-weight:700;font-size:.88rem}
.dock-in b{font-family:var(--f-pixel);font-size:1.7rem;font-weight:400}

/* ---------- result ---------- */
.res{max-width:1040px;margin-inline:auto;padding-block:16px 56px;display:grid;gap:18px}
.res-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.jump{appearance:none;cursor:pointer;height:38px;padding:0 16px;border-radius:999px;border:3px solid var(--ink);background:var(--ink);color:var(--paper);font:900 .85rem/1 var(--f-body);letter-spacing:.04em;box-shadow:0 3px 0 #000}
.jump:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.res-grid{display:grid;gap:26px;align-items:start}
.reveal{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;min-width:0}
.share{display:grid;gap:12px;min-width:0}
.share:focus,#h-all:focus,#h-all:focus-visible{outline:none}
@media(min-width:860px){.res-grid{grid-template-columns:minmax(0,1fr) minmax(0,440px)}.share{position:sticky;top:16px}.jump{display:none}}
/* 個人總場次 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l1 l1" "num disc" "l3 disc";align-items:center;column-gap:8px;row-gap:0;padding:18px 18px 16px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);overflow:hidden}
.h-l1{grid-area:l1;white-space:nowrap}.h-num{grid-area:num}.h-l3{grid-area:l3;align-self:start}.hero-disc{grid-area:disc}
.h-l1,.h-l3{margin:0;font:700 clamp(.95rem,4.2vw,1.2rem)/1.4 var(--f-min);color:var(--muted)}
.h-num{margin:4px 0 2px;display:flex;align-items:baseline;gap:10px;line-height:.82}
.h-num b{font:700 clamp(5.5rem,30vw,9rem)/.82 var(--f-num)}
.h-num span{font:800 clamp(1.8rem,8vw,2.6rem)/1 var(--f-min)}
.hero-disc{position:relative;width:clamp(96px,30vw,168px);aspect-ratio:1;flex:none}
.hero-disc .spin-disc{border-width:4px}
/* 專一版：年度紀錄與年度總表整塊隱藏（總計＋陀螺改畫在全年場次圖裡） */
#s-res.solo .reveal,#s-res.solo .share>h3,#s-res.solo .share>.prev{display:none}
@media(min-width:860px){#s-res.solo .res-grid{grid-template-columns:minmax(0,440px);justify-content:center}}

/* 粉絲稱號（黑色機台＋LCD 螢幕） */
.rank{background:var(--ink);border-radius:22px;padding:12px 12px 14px;box-shadow:0 6px 0 #000,inset 0 2px 0 rgba(255,255,255,.12);display:grid;gap:10px}
.rk-top span{white-space:nowrap;overflow:hidden}
@media(max-width:360px){.rk-top{letter-spacing:.08em}}
.rk-top{display:flex;align-items:center;gap:10px;padding:0 4px;color:#9AA0AD;font:400 1rem/1 var(--f-pixel);letter-spacing:.16em}
.rk-top .dot{width:8px;height:8px;border-radius:50%;background:var(--paper)}
.rk-top .bars{margin-left:auto;display:flex;gap:4px}
.rk-top .bars i{width:16px;height:4px;border-radius:2px;background:#4A4E59}
.rk-lcd{position:relative;overflow:hidden;background:var(--rk-bg);color:var(--rk-ink);border-radius:14px;padding:16px 18px 20px;display:grid;gap:4px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.35),inset 0 -12px 20px rgba(0,0,0,.08)}
.rk-lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,var(--rk-scan,rgba(255,154,46,.07)) 0 1px,transparent 1px 3px)}
.rk-pct{opacity:.12;user-select:none;-webkit-user-select:none;pointer-events:none}.rk-pct i{font-style:normal}
.rk-k{margin:0;font:400 1rem/1 var(--f-pixel);letter-spacing:.14em;opacity:.65}
.rk-lcd .rk-name,.rk-lcd .rk-en,.rk-lcd .rk-line,.rk-lcd .rk-k{text-shadow:var(--lcd-glow,none)}
.rk-name{margin:4px 0 0;font:800 clamp(2.6rem,14vw,3.8rem)/1.1 var(--f-min);letter-spacing:.04em;animation:rkIn .55s steps(7) both}
.rk-en{margin:0;font:700 1.15rem/1 var(--f-num);letter-spacing:.32em;text-transform:uppercase;opacity:.8}
.rk-line{margin:10px 0 0;font:700 .95rem/1.6 var(--f-min);opacity:.88}
@keyframes rkIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.prev{margin:0;display:grid;gap:10px}
.prev{position:relative}
.stage{position:relative}
.prev #card-img{display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);background:var(--silver)}
/* 預覽圖上的陀螺：疊一顆會原地旋轉的圓盤，位置與圖卡裡的靜態陀螺重合（下載的 JPG 仍是靜態圖） */
.spin-disc{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:var(--ink);border:.926cqw solid var(--ink)}
.spin-disc img{position:absolute;left:50%;top:50%;width:110.06%;height:auto;max-width:none;animation:spinTop 1s linear infinite}
@keyframes spinTop{from{transform:translate(-50%,-50%) rotate(-14deg)}to{transform:translate(-50%,-50%) rotate(346deg)}}
.act{display:flex;gap:10px;margin-top:6px}
.act>*{box-sizing:border-box;min-width:0;height:44px;padding:0;white-space:nowrap;border-radius:12px}
.act .btn-primary{flex:2 1 0;font:400 clamp(.8rem,3.4vw,.95rem)/1 var(--f-pixel);letter-spacing:.08em;box-shadow:0 4px 0 #000,inset 0 2px 0 rgba(255,255,255,.18)}
.act .btn-primary:active{transform:translateY(2px);box-shadow:0 2px 0 #000,inset 0 2px 0 rgba(255,255,255,.18)}
.act .btn-primary:disabled{box-shadow:0 4px 0 #6A6E78}
.act .btn-ghost svg{width:20px;height:20px}
.act .btn-ghost{flex:1 1 0;display:grid;place-items:center;border:0;box-shadow:inset 0 0 0 3px var(--ink),0 4px 0 var(--ink)}
.act .btn-ghost:active{box-shadow:inset 0 0 0 3px var(--ink),0 1px 0 var(--ink)}

.yr{margin-top:16px}
#s-all .all{max-width:440px;margin-inline:auto;display:grid;gap:14px}#s-all .yr{margin-top:0}
.yr img:not([src]){display:none}
.yr img{display:block;width:100%;height:auto;margin-top:10px;border:3px solid var(--ink);border-radius:14px;background:var(--paper)}
#asset-note{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:99;max-width:min(92vw,520px);padding:12px 16px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--ink);font:700 .95rem/1.5 "Noto Sans TC",sans-serif;text-align:center}
#asset-note[hidden]{display:none}
.toast{margin:4px 0 0;min-height:1.5em;font:400 1.05rem var(--f-pixel);letter-spacing:.14em;color:var(--muted)}
.stats{display:grid;gap:18px}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st{background:var(--pop-bg);border:3px solid var(--ink);border-radius:14px;padding:4px 9px 5px;display:grid;grid-template-rows:auto 1fr;gap:1px;min-width:0;box-shadow:3px 3px 0 var(--pop2);color:var(--pop-val)}
.st .k{font:400 clamp(.78rem,3.6vw,.9rem)/1.1 "DotGothic16",var(--f-body);color:var(--pop-ink);letter-spacing:.04em;white-space:nowrap;text-align:left}
.st .nw{white-space:nowrap}
.st .v{align-self:center;text-align:right;font:400 clamp(1.25rem,6vw,1.6rem)/1 var(--f-pixel);overflow-wrap:anywhere}
.st .v.mon{white-space:nowrap;overflow:hidden}
.st .v.mon.one{font-size:clamp(2.1rem,9.8vw,2.6rem);line-height:.8}
.st .v small{font-size:.5em;opacity:.7;margin-left:3px}
.st .v small.x{font:700 clamp(.64rem,2.9vw,.76rem)/1 var(--f-body);opacity:.75;margin-left:5px;white-space:nowrap}
.st .v.t{font:900 clamp(1rem,4.8vw,1.4rem)/1.05 var(--f-body)}
.st .v.c{font-size:clamp(2.1rem,9.8vw,2.6rem);line-height:.8}
.st .s{font:700 .78rem/1.2 var(--f-body);opacity:.7}
.sec h3{margin:0 0 10px;font:400 1.05rem var(--f-pixel);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;padding:8px;background:var(--paper);border:3px solid var(--ink);border-radius:14px}
.mcell{display:grid;grid-template-rows:auto 1fr;justify-items:center;align-items:center;min-width:0;padding:6px 0 5px;border:2px solid var(--ink);border-radius:8px;background:var(--ink);color:var(--paper);min-height:64px}
.mcell .ml{font:400 13px/1 var(--f-pixel);letter-spacing:.02em;opacity:.75}
.mcell .mv{font:400 clamp(20px,6.4vw,30px)/1 var(--f-pixel)}
.mcell.z{background:transparent;border:2px dashed var(--line);color:#8A8E99}
.mcell.z .mv{width:6px;height:6px;background:currentColor;opacity:.7}
.mcell.z .ml{opacity:.9}
@media(max-width:380px){.mgrid{gap:3px;padding:6px}.mcell .ml{font-size:12px}}
.sec h3 .cnt{margin-left:12px;color:var(--ink);font-size:1.35em;letter-spacing:.06em}
.mem{display:grid;gap:8px}
.mem-r{display:grid;grid-template-columns:4.5em minmax(0,1fr) 2.6em;gap:10px;align-items:center;font-weight:700;font-size:.9rem}
.mem-bar{height:16px;background:var(--paper);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.mem-bar i{display:block;height:100%}
.mem-r em{font:400 1.4rem var(--f-pixel);font-style:normal;text-align:right}
.city-grid{display:flex;flex-wrap:wrap;gap:8px}
.city-grid.rows{display:grid}
.city-row{display:flex;flex-wrap:wrap;gap:8px;max-width:100%}
.city{padding:5px 12px;border-radius:999px;border:3px solid var(--ink);font-weight:700;font-size:.88rem;background:var(--paper)}
.city.on{background:var(--ink);color:var(--paper)}
.city.off{border-style:dashed;border-color:var(--line);color:#8A8E99;background:transparent}
.city small{font-family:var(--f-pixel);font-size:1.15em;margin-left:5px;opacity:.85}

/* ---------- wipe ---------- */
.wipe{position:fixed;inset:0;z-index:100;display:grid;pointer-events:none;overflow:hidden}
.wipe[hidden]{display:none}
.wipe i{display:block;transform:scale(0);background:#0D0E12;margin:-.5px}
.wipe i:nth-child(3n){background:#171920}
.wipe i:nth-child(5n+1){background:#1F222B}
/* ---------- 轉場特效層（陀螺飛行／閃電） ---------- */
.fx{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}
.fx-dim,.fx-flash{position:absolute;inset:0;opacity:0}
.fx-dim{background:var(--ink)}
.fx-flash{background:#fff}
.bolt{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 16px rgba(255,255,255,.9))}
.bolt path{fill:none;stroke-linejoin:miter;stroke-linecap:square}

@media(prefers-reduced-motion:reduce){
  .top-disc img{animation-duration:24s}
  .spin-disc img{animation-duration:24s}
  .ev,.btn-primary,.btn-ghost{transition:none}
  .rk-name{animation:none}
}
@media(max-width:380px){.city-grid,.city-row{gap:6px}.city{padding:4px 8px;font-size:.8rem;border-width:2px}.city small{margin-left:3px}.ev{grid-template-columns:54px minmax(0,1fr) 32px;gap:8px}.ev-date b{font-size:36px}.ev-date.range b{font-size:26px}.tick{width:32px;height:32px}.ev[aria-pressed="true"] .tick::after{left:8px;top:2px}}
/* 所有按鈕的中文一律用像素中文字型 */
.btn-primary,.btn-ghost,.link,.jump,.act .btn-primary{font-family:"DotGothic16","Jersey 10","Noto Sans TC",sans-serif}
#btn-start{font-family:var(--f-num)}
/* 歡迎頁頂部小標：中文用像素中文字型 */
#egg-list .ev-title .nb{display:inline-block;white-space:nowrap}
#h-welcome{font-weight:700;font-size:clamp(1.05rem,5.6vw,1.82rem);white-space:nowrap;text-wrap:nowrap}
#s-welcome .eyebrow{font-family:"Jersey 10","DotGothic16","Noto Sans TC",ui-monospace,monospace}

/* ---------- 8/15 專場：未勾選＝雙層外框；勾選＝四色外框，勾下去時四色繞一圈 ---------- */
@property --sp-a{syntax:"<angle>";inherits:false;initial-value:0deg}
.ev.sp{position:relative;--sp-a:0deg;box-shadow:0 4px 0 var(--ink),inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--ink)}
.ev.sp:active{box-shadow:0 1px 0 var(--ink),inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--ink)}
.ev.sp[aria-pressed="true"]{border-color:transparent;
  background:linear-gradient(var(--ink),var(--ink)) padding-box,conic-gradient(from var(--sp-a),var(--yellow) 0 25%,var(--red) 0 50%,var(--green) 0 75%,var(--blue) 0) border-box;box-shadow:0 4px 0 var(--ink)}
.ev.sp[aria-pressed="true"]:active{box-shadow:0 1px 0 var(--ink)}
.ev.sp.run{animation:spRun 1.5s cubic-bezier(.5,.05,.25,1)}
@keyframes spRun{from{--sp-a:0deg}to{--sp-a:360deg}}
.ev.sp .ev-date{position:relative}
.ev.sp .ev-date::before{content:"";position:absolute;left:50%;top:20px;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid #FFE58F;box-shadow:0 0 6px 1px rgba(255,205,70,.9),inset 0 0 5px 1px rgba(255,215,100,.8);opacity:0;pointer-events:none}
.ev.sp.burst .ev-date::before{animation:spDateRing .9s cubic-bezier(.12,.7,.2,1)}
.ev.sp.burst .ev-date b{animation:spNum 1.1s cubic-bezier(.2,.8,.3,1)}
.ev .spark{position:absolute;margin:-3px 0 0 -3px;border-radius:2px;background:#FFD54A;box-shadow:0 0 8px 2px rgba(255,200,60,.9);pointer-events:none;opacity:0;z-index:3;animation:spFly 1s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes spNum{0%{transform:scale(1)}18%{transform:scale(1.2);color:#FFE58F;text-shadow:0 0 10px #FFD54A,0 0 24px #FFB300,0 0 40px rgba(255,190,40,.8)}100%{transform:scale(1);text-shadow:0 0 0 rgba(255,200,60,0)}}
@keyframes spDateRing{0%{opacity:.4;transform:scale(.35)}100%{opacity:0;transform:scale(1.4)}}
@keyframes spFly{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2) rotate(180deg)}}
@media(prefers-reduced-motion:reduce){.ev.sp.run,.ev.sp.burst .ev-date b,.ev.sp.burst .ev-date::before{animation:none}.ev .spark{display:none}}
</style>


</head>
<body>
<!-- ============ 歡迎頁 ============ -->
<section id="s-welcome" class="screen welcome" aria-labelledby="h-welcome">
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  <div class="wrap" id="wrap">
    <p class="eyebrow">U:NUS ・ 2026 年度活動紀錄</p>
    <div class="top" id="top"><div class="top-disc"><img data-cover alt=""></div></div>
    <h1 id="h-welcome">是打開，也是展開；<br>是今年所有發生的一切。</h1>
    <form id="f-name" novalidate>
      <label for="in-name">NAME</label>
      <div class="field">
        <input id="in-name" name="nick" maxlength="14" autocomplete="off" enterkeyhint="go">
        <button type="button" id="btn-start" class="btn-primary">U:NFOLDING ...</button>
      </div>
      <p class="err" id="err-name" role="alert" hidden>先輸入名字，才能開始。</p>
    </form>
  </div>
  <footer class="copy" data-copy></footer>
</section>

<!-- ============ 行事曆 ============ -->
<section id="s-cal" class="screen" hidden aria-labelledby="h-cal">
  <div class="cal">
    <div class="sticky">
      <div class="bar">
        <div>
          <p class="hi">HI, <b id="hi-name"></b></p>
          <h2 id="h-cal" class="sr" tabindex="-1">選取參與場次</h2>
        </div>
        <div class="lcd" id="meter" role="progressbar" aria-label="已勾選比例" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="cells" aria-hidden="true"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></span></div>
      </div>
    </div>
    <div class="filters">
      <div class="row" role="group" aria-label="成員" id="row-mem"></div>
    </div>
    <div id="list"></div>
    <footer class="copy cal-copy" data-copy></footer>
  </div>
  <div class="dock">
    <div class="dock-in">
      <span id="dock-txt">還沒勾選任何場次</span>
      <button type="button" class="btn-primary" id="btn-gen" disabled>Machi Gö →</button>
    </div>
  </div>
</section>

<!-- ============ 彩蛋頁（只有「全部只勾小分隊」才會到這裡） ============ -->
<section id="s-egg" class="screen" hidden aria-labelledby="h-egg">
  <div class="cal">
    <div class="sticky">
      <div class="bar">
        <div>
          <p class="hi">HI, <b id="egg-name"></b></p>
          <h2 id="h-egg" class="sr" tabindex="-1">還有一場</h2>
        </div>
      </div>
    </div>
    <div id="egg-list"></div>
  </div>
  <div class="dock">
    <div class="dock-in">
      <button type="button" class="btn-primary" id="btn-egg" style="margin-left:auto">Machi Gö →</button>
    </div>
  </div>
</section>

<!-- ============ 統計頁 ============ -->
<section id="s-res" class="screen" hidden aria-labelledby="h-res">
  <div class="res">
    <div class="res-head">
      <button type="button" class="link" id="btn-back">← 返回修改</button>
    </div>
    <div class="res-grid">
      <div class="reveal">
        <h2 id="h-res" class="eyebrow" tabindex="-1">YOUR 2026 ・ 年度紀錄<span class="rk-pct" aria-hidden="true"> ・ <i id="rk-pct"></i></span></h2>
        <section class="hero" aria-label="個人總場次">
          <p class="h-l1" id="h-l1"></p>
          <p class="h-num"><b id="h-n"></b><span>場</span></p>
          <p class="h-l3" id="h-l3">有你的參與。</p>
          <div class="hero-disc" aria-hidden="true"><div class="spin-disc"><img data-cover alt=""></div></div>
        </section>
        <section class="rank" aria-labelledby="rk-name">
          <div class="rk-top"><i class="dot"></i><i class="bars"><i></i><i></i><i></i></i></div>
          <div class="rk-lcd">
            <p class="rk-k">登陸星球</p>
            <p class="rk-name" id="rk-name"></p>
            <p class="rk-en" id="rk-en"></p>
            <p class="rk-line" id="rk-line"></p>
          </div>
        </section>
        <div class="stats" id="stats"></div>
      </div>
      <aside class="share" id="share" tabindex="-1" aria-label="保存結果">
        <h3 class="eyebrow">YOUR 2026 ・ 年度總表</h3>
        <figure class="prev">
          <div class="stage">
            <img id="card-img" alt="年度出席總表圖卡" width="1080" height="1350">
          </div>
        </figure>
        <section class="yr"><h3 class="eyebrow">YOUR 2026 ・ 全年場次</h3><div id="year-imgs"></div></section>
        <div class="act">
          <button type="button" class="btn-primary" id="btn-dl">下載年度總表</button>
          <button type="button" class="btn-primary" id="btn-dl-year" disabled>下載全年場次</button>
          <button type="button" class="btn-ghost" id="btn-reset" aria-label="全部清除重來" title="全部清除重來"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg></button>
        </div>
        <p class="toast" id="toast" role="status"></p>
      </aside>
    </div>
  </div>
</section>

<!-- ============ 隱藏頁：全年總場次圖（歡迎頁 © 連點兩下） ============ -->
<section id="s-all" class="screen" hidden aria-labelledby="h-all">
  <div class="res">
    <div class="res-head"><button type="button" class="link" id="btn-all-back">← 返回</button></div>
    <div class="all">
      <h2 id="h-all" class="eyebrow" tabindex="-1">YOUR 2026 ・ 全年總場次</h2>
      <section class="yr"><div id="all-imgs"></div></section>
      <div class="act"><button type="button" class="btn-primary" id="btn-dl-all" disabled>下載全年場次</button></div>
      <p class="toast" id="toast-all" role="status"></p>
    </div>
  </div>
</section>

<div class="sheet" id="save-sheet" hidden role="dialog" aria-modal="true" aria-label="儲存圖片">
  <div class="sheet-imgs" id="sheet-imgs"></div>
  <div class="sheet-bar"><span>長按圖片 → 儲存到相簿</span><button type="button" class="btn-primary" id="sheet-close">關閉</button></div>
</div>

function computeStats(){
  const P=EV.filter(e=>state.picked.has(e.id));
  const monPicked=Array(12).fill(0),mem={},cat={'團體':0,'小分隊':0,'個人':0},byCity=new Map();
  MEM.forEach(n=>mem[n]=0);
  P.forEach(e=>{monPicked[e.m-1]++;e.members.forEach(n=>mem[n]++);cat[e.cat]++;if(!NONCITY.has(e.loc))byCity.set(e.loc,(byCity.get(e.loc)||0)+1)});
  const cities=[...byCity.entries()].sort((a,b)=>b[1]-a[1]);
  const topCityN=cities.length?cities[0][1]:0;
  const topCities=cities.filter(c=>c[1]===topCityN).map(c=>c[0]);
  const maxMon=Math.max(...monPicked);
  const topMonths=maxMon>0?monPicked.map((v,i)=>v===maxMon?i+1:0).filter(Boolean):[];
  return {P,n:P.length,monPicked,mem,cat,cities,byCity,topCityN,topCities,
    monthsWith:monPicked.filter(v=>v>0).length,maxMon,topMonths};
}

function rkRGB(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
function rkA(h,a){return 'rgba('+rkRGB(h).join(',')+','+a+')'}
function rkMix(h,base,k){const v=rkRGB(h);return '#'+v.map((x,i)=>Math.round(base[i]*(1-k)+x*k).toString(16).padStart(2,'0')).join('')}
function rkTheme(R){const c=R.c;return{c,bg:rkMix(c,[13,14,18],.09),ink:c,lab:rkA(c,.62),en:rkA(c,.85),scan:rkA(c,.07),glow:18,gc:rkA(c,.9),led:rkA(c,.95),ledEn:rkA(c,.8),deep:rkMix(c,[0,0,0],.8),shade:rkA(rkMix(c,[0,0,0],.45),.38)}}
/* 稱號分數：團體（全員＋三缺一＋小分隊）出席率佔 70%，個人場佔 30% 並平分給所選的成員類別；
   對所有可能的組合（含只看團體）各算一次，取最高分。只有名稱會顯示給使用者，不顯示比例。 */
function rankScore(){
  const rate=pred=>{const l=EVA.filter(pred);return l.length?l.filter(e=>state.picked.has(e.id)).length/l.length:0};
  const g=rate(e=>e.cat!=='個人');
  const P=MEM.filter(m=>EVA.some(e=>e.cat==='個人'&&e.members.includes(m))).map(m=>rate(e=>e.cat==='個人'&&e.members.includes(m)));
  let best=g;
  for(let mask=1;mask<(1<<P.length);mask++){
    const pick=P.filter((_,i)=>mask&(1<<i));
    const avg=pick.reduce((a,b)=>a+b,0)/pick.length;
    best=Math.max(best,.7*g+.3*avg);
  }
  return best;
}

   只要勾了一場團體，就照一般算法。順序＝成員色順序，小分隊排在高有翔的位置。 */

function soloSubjects(){
  const P=EVA.filter(e=>state.picked.has(e.id));
  if(!P.length||P.some(e=>e.cat==='團體'))return null;
  const keys=new Set(P.map(e=>e.cat==='小分隊'?'ak':e.members[0]));
  const out=[];
  SOLO_ORDER.forEach(k=>{
    if(!keys.has(k))return;
    let evs=k==='ak'?EV.filter(e=>e.cat==='小分隊'):EV.filter(e=>e.cat==='個人'&&e.members.includes(k));
    /* 彩蛋：只有「全部只勾小分隊」才把彩蛋場次算進小分隊（不論有沒有勾，總數都是 7 場） */
    if(k==='ak'&&keys.size===1)evs=evs.concat(EGG).sort((a,b)=>a.m-b.m||a.d-b.d||a.id-b.id);
    out.push({key:k,kind:k==='ak'?'ak':'p',member:k==='ak'?null:k,title:'AK嘻哈小分隊',tag:SOLO_TAG[k],evs,total:evs.filter(e=>!e.off).length,n:evs.filter(e=>isOn(e)).length});
  });
  return out.length?out:null;
}

/* 像素方塊轉場：整個畫面由左上往右下，被一格一格的深色方塊蓋住（階梯式放大，像電子寵物的 LCD），退出時從左下往右上一格一格消失 */
let _pix=[];
function buildPix(){
  const w=$('#wipe');w.textContent='';
  const W=innerWidth,H=innerHeight,S=Math.max(34,Math.round(Math.min(W,H)/9)),cols=Math.ceil(W/S),rows=Math.ceil(H/S);
  w.style.gridTemplateColumns='repeat('+cols+',1fr)';w.style.gridTemplateRows='repeat('+rows+',1fr)';
  _pix=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const e=document.createElement('i');
    const j=Math.random()*130;
    e._d=((c/cols)*.55+(r/rows)*.45)*480+j;            /* 蓋上：左上 → 右下 */
    e._d2=((c/cols)*.55+((rows-1-r)/rows)*.45)*480+j;  /* 退出：左下 → 右上 */
    w.appendChild(e);_pix.push(e);
  }
}
async function wipeIn(){
  const w=$('#wipe');buildPix();w.hidden=false;
  const a=_pix.map(e=>e.animate([{transform:'scale(0)'},{transform:'scale(1)'}],{duration:210,delay:e._d,easing:'steps(3,end)',fill:'forwards'}));
  await Promise.all(a.map(x=>x.finished));
}
async function wipeOut(){
  const w=$('#wipe');
  const a=_pix.map(e=>e.animate([{transform:'scale(1)'},{transform:'scale(0)'}],{duration:210,delay:e._d2,easing:'steps(3,end)',fill:'forwards'}));
  await Promise.all(a.map(x=>x.finished));
  w.hidden=true;w.textContent='';_pix=[];
}
/* 歡迎頁 → 行事曆：陀螺邊放大邊在畫面上四處游走，最後衝滿畫面，再淡出露出行事曆 */
async function goCalendar(){
  if(busy)return;busy=true;
  $('#hi-name').textContent=state.name;$('.hi').classList.toggle('long',[...state.name].length>8);
  renderList();updateCounters();
  if(reduce){show('s-cal');busy=false;return}
  const T0=performance.now(),top=$('#top'),wrap=$('#wrap');
  const r=top.getBoundingClientRect(),W=innerWidth,H=innerHeight,d=r.width,cx=r.left+d/2,cy=r.top+d/2;
  const fx=el('div','fx');
  const disc=top.cloneNode(true);disc.removeAttribute('id');
  Object.assign(disc.style,{position:'absolute',left:r.left+'px',top:r.top+'px',width:d+'px',height:d+'px',margin:'0'});
  fx.appendChild(disc);document.body.appendChild(fx);
  top.style.visibility='hidden';
  [...wrap.children].filter(c=>c!==top).forEach(c=>c.animate([{opacity:1},{opacity:0}],{duration:320,fill:'forwards'}));
  const sMax=1.15*Math.hypot(W,H)/d;
  /* 路線：陀螺在畫面上劃出一個直立的「8」字（先掃向右側、再繞到左側，上下兩個圓弧都幾乎碰到畫面邊緣），
     弧度隨時間收小、身體同時愈放愈大，最後正好回到畫面中央衝滿畫面。
     用 48 個取樣點連成平滑曲線；起點用陀螺原本的位置慢慢過渡進去，所以一開始不會跳。 */
  const NK=48,kf=[],ox=cx-W/2,oy=cy-H/2;
  for(let k=0;k<=NK;k++){
    const t=k/NK,th=Math.PI*2*t,amp=1-Math.pow(t,2);
    const x=W/2+Math.sin(th)*amp*W*.4+ox*Math.pow(1-t,2.5);
    const y=H/2+Math.sin(2*th)*amp*H*.31+oy*Math.pow(1-t,2.5);
    const sc=1+(sMax-1)*Math.pow(t,3);
    kf.push({offset:t,easing:'linear',transform:`translate(${(x-cx).toFixed(1)}px,${(y-cy).toFixed(1)}px) rotate(${Math.round(t*1800)}deg) scale(${sc.toFixed(3)})`});
  }
  const fly=disc.animate(kf,{duration:1150,fill:'forwards'});
  setTimeout(()=>{disc.style.filter='none'},300); /* 陀螺放大後的陰影很吃效能，動起來之後就關掉 */
  await fly.finished;
  show('s-cal');
  document.getAnimations().forEach(a=>{const t=a.effect&&a.effect.target;const isCss=window.CSSAnimation&&a instanceof CSSAnimation;if(!isCss&&t&&wrap.contains(t))a.cancel()});
  top.style.visibility='';
  /* 整段轉場以 1.5 秒為上限：淡出的長度依前面實際花掉的時間縮短 */
  const out=fx.animate([{opacity:1},{opacity:0}],{duration:Math.max(100,Math.min(300,1500-(performance.now()-T0))),easing:'ease-out',fill:'forwards'});
  await out.finished;
  fx.remove();busy=false;
}

/* 行事曆 → 彩蛋頁：畫面變暗，閃電劈下，白光一閃後換成彩蛋頁，再閃兩下淡去 */
async function goEgg(){
  if(busy)return;busy=true;
  renderEgg();
  if(reduce){show('s-egg');busy=false;return}
  const W=innerWidth,H=innerHeight,NS='http://www.w3.org/2000/svg';
  const fx=el('div','fx'),dim=el('div','fx-dim'),flash=el('div','fx-flash');
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('class','bolt');
  const rnd=(a,b)=>a+Math.random()*(b-a);
  /* 沿著 A→B 走 N 段，左右交錯偏移，做出鋸齒狀的閃電 */
  const zig=(ax,ay,bx,by,n,amp)=>{const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,out=[[ax,ay]];
    for(let k=1;k<=n;k++){const o=k===n?0:(k%2?1:-1)*amp*rnd(.5,1.4);out.push([ax+dx*k/n+nx*o,ay+dy*k/n+ny*o])}return out};
  const x0=W*rnd(.4,.6),endY=H*rnd(.5,.6);
  const top=zig(x0,-12,x0+W*rnd(-.05,.05),endY,9,W*.07);
  /* 左右兩道又長又斜，都往下劈：左邊從左緣約三成高度往右下落到畫面偏左的下方；右邊從右緣約六成高度往左下落到畫面中間偏下 */
  const yl=H*rnd(.26,.38),yr=H*rnd(.52,.64);
  const left=zig(-14,yl,W*rnd(.26,.38),yl+H*rnd(.34,.42),9,W*.045);
  const right=zig(W+14,yr,W*rnd(.46,.6),Math.min(H*.93,yr+H*rnd(.24,.32)),8,W*.045);
  const branch=(pts,k,d,len)=>{const b=pts[k];return [b,[b[0]+d*W*.08,b[1]+len*.5],[b[0]+d*W*.04,b[1]+len],[b[0]+d*W*.11,b[1]+len*1.5]]};
  const bolts=[
    {lines:[top,branch(top,4,Math.random()<.5?-1:1,H*.05)],w:1,delay:0},
    {lines:[left,branch(left,3,1,H*.04)],w:.8,delay:rnd(50,90)},
    {lines:[right,branch(right,3,-1,H*.04)],w:.8,delay:rnd(100,150)}
  ];
  const dstr=a=>a.map((p,k)=>(k?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const layers=[['#0D0E12',18],['#FFFFFF',10],['#EEF2F8',4]],paths=[];
  layers.forEach(([c,w])=>bolts.forEach(bt=>bt.lines.forEach((ln,k)=>{
    const pa=document.createElementNS(NS,'path');pa.setAttribute('d',dstr(ln));pa.setAttribute('stroke',c);
    pa.setAttribute('stroke-width',Math.max(2,Math.round(w*bt.w*(k?.55:1))));svg.appendChild(pa);
    const L=pa.getTotalLength();pa.style.strokeDasharray=L;pa.style.strokeDashoffset=L;pa._L=L;pa._d=bt.delay;paths.push(pa);
  })));
  fx.append(dim,svg,flash);document.body.appendChild(fx);
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  await dim.animate([{opacity:0},{opacity:.62}],{duration:170,fill:'forwards'}).finished;
  await Promise.all(paths.map(pa=>pa.animate([{strokeDashoffset:pa._L},{strokeDashoffset:0}],{duration:150,delay:pa._d,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'}).finished));
  await wait(50);
  const cal=$('#s-cal .cal');
  cal.animate([{transform:'translate(0,0)'},{transform:'translate(-7px,4px)'},{transform:'translate(6px,-5px)'},{transform:'translate(-4px,3px)'},{transform:'translate(3px,-2px)'},{transform:'translate(0,0)'}],{duration:300});
  await flash.animate([{opacity:0},{opacity:1}],{duration:50,fill:'forwards'}).finished;
  show('s-egg');dim.remove();svg.remove();
  await flash.animate([{opacity:1,offset:0},{opacity:.2,offset:.22},{opacity:.85,offset:.36},{opacity:0,offset:1}],{duration:560,easing:'linear',fill:'forwards'}).finished;
  fx.remove();busy=false;
}
/* 足跡遍佈換行規則：
   第 1 行固定放最多的前 3 個城市；之後每行數量可以不同，但每行至少 3 個；最後一行至少 4 個。
   先把所有標籤攤平量寬度，再用動態規劃找出符合規則的分行（城市太少或螢幕太窄排不出來時，依序放寬）。 */
const CITY_FIRST=3, CITY_LEVELS=[[3,4],[3,3],[2,3],[2,2],[1,1]];
function planRows(w,gap,W,minRow,minLast){
  const m=w.length, INF=1e9, best=Array(m+1).fill(INF), nxt=Array(m+1).fill(-1);
  best[m]=0;
  const span=(i,j)=>{let t=0;for(let k=i;k<j;k++)t+=w[k];return t+gap*(j-i-1)};
  for(let i=m-1;i>=0;i--){
    for(let j=i+1;j<=m;j++){
      const sz=j-i, last=(j===m);
      if(sz<(last?minLast:minRow))continue;
      if(sz>1&&span(i,j)>W)break;
      if(best[j]>=INF)continue;
      const c=1+best[j];
      if(c<best[i]||(c===best[i]&&j>nxt[i])){best[i]=c;nxt[i]=j}
    }
  }
  if(best[0]>=INF)return null;
  const rows=[];for(let i=0;i<m;i=nxt[i])rows.push([i,nxt[i]]);
  return rows;
}

function fitMon(){
  const e=document.querySelector('.st .v.mon');if(!e||!e.clientWidth)return;
  e.style.fontSize='';let fs=parseFloat(getComputedStyle(e).fontSize);
  while(e.scrollWidth>e.clientWidth+.5&&fs>11){fs-=1;e.style.fontSize=fs+'px'}
}
function fixCityRows(){
  const g=document.querySelector('.city-grid');if(!g||!g.offsetParent)return;
  const chips=[...g.querySelectorAll('.city')];
  g.classList.remove('rows');g.replaceChildren(...chips);
  if(chips.length<=CITY_FIRST)return;
  const cs=getComputedStyle(g),gap=parseFloat(cs.columnGap)||8,W=g.clientWidth;
  const w=chips.map(c=>c.getBoundingClientRect().width);
  const rest=chips.slice(CITY_FIRST),rw=w.slice(CITY_FIRST);
  let rows=null;
  for(const [a,b] of CITY_LEVELS){rows=planRows(rw,gap,W,a,b);if(rows)break}
  if(!rows)return;
  const mk=list=>{const r=document.createElement('div');r.className='city-row';r.append(...list);return r};
  g.classList.add('rows');
  g.replaceChildren(mk(chips.slice(0,CITY_FIRST)),...rows.map(([i,j])=>mk(rest.slice(i,j))));
}

/* items: [{c: canvas, filename}]；一次存一張或多張 */
async function saveCanvases(items){
  const list=items.filter(i=>i.c);
  if(!list.length){say('圖片還沒準備好，請稍後再試。');return}
  const blobs=await Promise.all(list.map(i=>prepBlob(i.c)));
  if(blobs.some(b=>!b)){say('圖片產生失敗，請重試。');return}
  let dl=null;
  try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(_){dl=null}
  if(dl){
    try{for(let i=0;i<list.length;i++)await dl.save({filename:list[i].filename,data:blobs[i]});say('已送出儲存。')}
    catch(err){say(err&&err.code==='declined'?'已取消下載。':'下載沒有成功，請按右鍵（電腦）或長按（手機）圖片儲存。')}
    return;
  }
  /* iPhone / iPad：系統分享面板（可一次收多張），點「儲存影像」即進相簿 */
  if(IS_IOS){
    if(navigator.share){
      try{
        const files=list.map((it,i)=>new File([blobs[i]],it.filename,{type:'image/jpeg'}));
        if(!navigator.canShare||navigator.canShare({files})){await navigator.share({files});return}
      }catch(err){if(err&&err.name==='AbortError')return}
    }
    openSheet(blobs);return;
  }
  /* Android 內建瀏覽器（LINE／IG／FB）常擋下載：直接顯示長按面板 */
  if(IS_MOBILE&&IN_APP){openSheet(blobs);return}
  /* 一般瀏覽器：直接下載（Android 會自動出現在相簿）；多張依序下載 */
  try{
    for(let i=0;i<list.length;i++){
      const u=URL.createObjectURL(blobs[i]),a=document.createElement('a');
      a.href=u;a.download=list[i].filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),6000);
      if(i<list.length-1)await sleep(450);
    }
    say('下載中...');
  }catch(_){if(IS_MOBILE)openSheet(blobs);else say('這個檢視環境無法直接下載，請按右鍵圖片另存。')}
}

/* 專一版有多個結果時，畫面上仍是各自一張；下載時把它們由上到下接成一張直向長圖，只存一個檔 */
let _stitch=null;
function stitchYears(cs){
  if(cs.length<2)return cs[0]||null;
  if(_stitch&&_stitch.src===cs)return _stitch.c;
  const H=cs.reduce((a,c)=>a+c.height,0);
  const o=document.createElement('canvas');o.width=cs[0].width;o.height=H;
  const g=o.getContext('2d');let y=0;
  cs.forEach(c=>{g.drawImage(c,0,y);y+=c.height});
  _stitch={src:cs,c:o};return o;
}
const downloadYear=()=>{
  const cs=window._years||[];
  saveCanvases([{c:stitchYears(cs),filename:'UNUS-2026-all-events-'+safeName()+(cs.length===1&&(window._yearTags||[])[0]?'-'+window._yearTags[0]:'')+'.jpg'}]);
};

  $('#err-name').hidden=true;state.name=v.slice(0,14);save();goCalendar();
}

function spRun(b){
  if(reduce)return;
  b.classList.remove('run','burst');void b.offsetWidth;b.classList.add('run','burst');
  const dt=b.querySelector('.ev-date'),nb=dt.querySelector('b'),cols=['#FFD54A','#FFF1B0','#FFB300','#FFE58F'];
  const cx=dt.offsetWidth/2,cy=nb.offsetTop+nb.offsetHeight/2,nw=nb.offsetWidth,nh=nb.offsetHeight;
  for(let i=0;i<13;i++){
    const x=cx+(Math.random()-.5)*nw*.8,y=cy+(Math.random()-.5)*nh*.6;
    let vx=x-cx+(Math.random()-.5)*8,vy=y-cy+(Math.random()-.5)*8,m=Math.hypot(vx,vy)||1;const d=17+Math.random()*30,z=5+Math.random()*6;
    const sp=document.createElement('i');sp.className='spark';
    sp.style.cssText='left:'+x+'px;top:'+y+'px;width:'+z.toFixed(1)+'px;height:'+z.toFixed(1)+'px;--dx:'+(vx/m*d).toFixed(1)+'px;--dy:'+(vy/m*d).toFixed(1)+'px;background:'+cols[i%4]+';animation-delay:'+(Math.random()*.1).toFixed(2)+'s';
    dt.appendChild(sp);setTimeout(()=>sp.remove(),1300);
  }
  setTimeout(()=>b.classList.remove('run','burst'),1600);
}
$('#list').addEventListener('click',ev=>{
  const b=ev.target.closest('.ev');if(!b||b.disabled)return;
  const id=Number(b.dataset.id);
  if(state.picked.has(id))state.picked.delete(id);else state.picked.add(id);
  b.setAttribute('aria-pressed',state.picked.has(id));save();
  if(b.classList.contains('sp')&&state.picked.has(id))spRun(b);
  updateCounters();
});
(function(){
  const row=$('#row-mem');
  const tabs=[{k:'',n:'全部'}].concat(MEM.map(n=>({k:n,n})));
  tabs.forEach(t=>{
    const b=document.createElement('button');b.type='button';b.className='tab';b.setAttribute('aria-pressed',t.k===''?'true':'false');b.dataset.mem=t.k;
    if(t.k){b.classList.add('m');const i=document.createElement('i');i.style.background=COL[t.k];b.append(i);b.setAttribute('aria-label',t.n);b.title=t.n}
    const f=document.createElement('span');f.className='full';f.textContent=t.n;b.append(f);
    if(t.k){const x=document.createElement('span');x.className='abbr';x.textContent=[...t.n].pop();b.append(x)}
    row.appendChild(b);
  });
  row.addEventListener('click',ev=>{
    const b=ev.target.closest('.tab');if(!b)return;
    state.mem=b.dataset.mem;
    row.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===b));
    renderList();updateCounters();
  });
})();
